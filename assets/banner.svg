<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#090d16;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="bgGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a1024"/><stop offset="50%" stop-color="#0c1833"/><stop offset="100%" stop-color="#080c18"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="edgeGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0ea5e9" stop-opacity=".4"/><stop offset="100%" stop-color="#6366f1" stop-opacity=".4"/></linearGradient><linearGradient id="pillGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".9"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="pulseGlow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulse{0%{transform:scale(1);opacity:.7}50%{transform:scale(1.18);opacity:1}}@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes dashFlow{0%{stroke-dashoffset:200}}@keyframes orbit{0%{transform:rotate(0deg) translate(28px) rotate(0deg)}}@keyframes beacon{0%{r:6px;opacity:1}}.node-pulse-1{animation:pulse 4s ease-in-out infinite;transform-origin:160px 100px}.node-pulse-2{animation:pulse 5s ease-in-out infinite 1s;transform-origin:1040px 120px}.node-pulse-3{animation:pulse 3.5s ease-in-out infinite .5s;transform-origin:980px 260px}.node-pulse-4{animation:pulse 4.5s ease-in-out infinite 1.5s;transform-origin:220px 270px}.edge-flow{stroke-dasharray:8 8;animation:dashFlow 20s linear infinite}.edge-flow-reverse{stroke-dasharray:6 6;animation:dashFlow 15s linear infinite reverse}.beacon-ring-1{animation:beacon 2.8s cubic-bezier(0,.2,.8,1) infinite}.beacon-ring-2{animation:beacon 3.2s cubic-bezier(0,.2,.8,1) infinite 1.2s}.floating-badges{animation:floatSlow 6s ease-in-out infinite}</style></defs><rect width="1200" height="360" fill="url(#bgGlow)" rx="12"/><rect width="1200" height="360" fill="none" stroke="#1e293b" stroke-width="1.5" rx="12"/><g opacity=".65"><line x1="160" x2="220" y1="100" y2="270" stroke="url(#edgeGrad1)" stroke-width="2" class="edge-flow"/><line x1="160" x2="380" y1="100" y2="60" stroke="#38bdf8" stroke-opacity=".3" stroke-width="1.5"/><line x1="220" x2="360" y1="270" y2="300" stroke="#818cf8" stroke-opacity=".3" stroke-width="1.5"/><line x1="860" x2="1040" y1="70" y2="120" stroke="url(#edgeGrad1)" stroke-width="2" class="edge-flow"/><line x1="1040" x2="980" y1="120" y2="260" stroke="#c084fc" stroke-opacity=".35" stroke-width="2" class="edge-flow-reverse"/><line x1="980" x2="840" y1="260" y2="290" stroke="#818cf8" stroke-opacity=".25" stroke-width="1.5"/><line x1="1040" x2="1130" y1="120" y2="200" stroke="#38bdf8" stroke-opacity=".25" stroke-width="1.5"/><line x1="70" x2="160" y1="180" y2="100" stroke="#6366f1" stroke-opacity=".3" stroke-width="1.5"/><line x1="70" x2="220" y1="180" y2="270" stroke="#38bdf8" stroke-opacity=".25" stroke-width="1.5"/><circle cx="160" cy="100" r="8" fill="none" stroke="#38bdf8" class="beacon-ring-1"/><circle cx="1040" cy="120" r="8" fill="none" stroke="#c084fc" class="beacon-ring-2"/><g class="node-pulse-1"><circle cx="160" cy="100" r="16" fill="#0284c7" filter="url(#glow)"/><circle cx="160" cy="100" r="8" fill="#e0f2fe"/></g><g class="node-pulse-4"><circle cx="220" cy="270" r="13" fill="#6366f1" filter="url(#glow)"/><circle cx="220" cy="270" r="6" fill="#e0e7ff"/></g><circle cx="70" cy="180" r="8" fill="#0ea5e9" opacity=".6"/><circle cx="380" cy="60" r="6" fill="#818cf8" opacity=".5"/><circle cx="360" cy="300" r="7" fill="#38bdf8" opacity=".4"/><g class="node-pulse-2"><circle cx="1040" cy="120" r="18" fill="#9333ea" filter="url(#glow)"/><circle cx="1040" cy="120" r="9" fill="#f5d0fe"/></g><g class="node-pulse-3"><circle cx="980" cy="260" r="14" fill="#0284c7" filter="url(#glow)"/><circle cx="980" cy="260" r="7" fill="#bae6fd"/></g><circle cx="860" cy="70" r="7" fill="#c084fc" opacity=".5"/><circle cx="840" cy="290" r="6" fill="#6366f1" opacity=".4"/><circle cx="1130" cy="200" r="8" fill="#38bdf8" opacity=".5"/></g><g><g transform="translate(600, 52)"><rect width="280" height="28" x="-140" y="-14" fill="#1e293b" stroke="#334155" stroke-width="1" rx="14"/><text x="0" y="5" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">CURATED AWESOME ECOSYSTEM</text></g><text x="600" y="125" fill="url(#titleGrad)" font-size="46" font-weight="900" letter-spacing="-1" text-anchor="middle">Awesome Graph Database</text><text x="600" y="165" fill="#cbd5e1" font-size="17" font-weight="400" letter-spacing=".3" text-anchor="middle">The Ultimate Directory of SaaS Platforms &amp; Open-Source Graph Engines</text><text x="600" y="195" fill="#94a3b8" font-size="13.5" font-weight="500" letter-spacing=".5" text-anchor="middle">Property Graphs • RDF / SPARQL • GraphRAG &amp; Vector • Distributed &amp; Embedded Engines</text><g class="floating-badges"><g transform="translate(600, 260) translate(-320, 0)"><rect width="110" height="36" x="-55" y="-18" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2" rx="18"/><text x="0" y="5" fill="#e0f2fe" font-size="13" font-weight="600" text-anchor="middle">⚡ Cypher</text></g><g transform="translate(600, 260) translate(-190, 0)"><rect width="130" height="36" x="-65" y="-18" fill="url(#pillGrad1)" stroke="#818cf8" stroke-width="1.2" rx="18"/><text x="0" y="5